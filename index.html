<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TesteStudio</title>
    <link rel="stylesheet" href="https://unpkg.com/@carbon/charts@1.27.3/styles.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="cds--skip-to-content" href="#main-content">Pular para conteudo</a>

    <header class="cds--header" aria-label="IBM Platform Name">
      <button
        id="header-menu-toggle"
        class="cds--header__menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="side-nav">
        <img class="icon-24" src="https://unpkg.com/@carbon/icons-svg@10.58.0/svg/24/menu.svg" alt="" aria-hidden="true" />
      </button>

      <a class="cds--header__name" href="#main-content">
        <span class="cds--header__name--prefix">IBM</span>
        TesteStudio
      </a>

      <nav class="cds--header__nav" aria-label="IBM [Platform]">
        <a class="cds--header__menu-item" href="#main-content">Dashboard</a>
        <a class="cds--header__menu-item" href="#chart-container">Graficos</a>
      </nav>

      <div class="cds--header__global">
        <button class="cds--header__action" type="button" aria-label="Search">
          <img class="icon-24" src="https://unpkg.com/@carbon/icons-svg@10.58.0/svg/24/search.svg" alt="" aria-hidden="true" />
        </button>
        <button class="cds--header__action" type="button" aria-label="Notifications">
          <img class="icon-24" src="https://unpkg.com/@carbon/icons-svg@10.58.0/svg/24/notification.svg" alt="" aria-hidden="true" />
        </button>
        <button class="cds--header__action" type="button" aria-label="App switcher">
          <img class="icon-24" src="https://unpkg.com/@carbon/icons-svg@10.58.0/svg/24/switcher.svg" alt="" aria-hidden="true" />
        </button>
      </div>
    </header>

    <div id="side-nav-overlay" class="cds--side-nav__overlay" hidden></div>

    <aside id="side-nav" class="cds--side-nav" aria-label="Side navigation" aria-hidden="true">
      <nav class="cds--side-nav__navigation">
        <ul class="cds--side-nav__items">
          <li class="cds--side-nav__item">
            <a class="cds--side-nav__link" href="#main-content">Visao geral</a>
          </li>

          <li class="cds--side-nav__item is-open">
            <button
              class="cds--side-nav__submenu"
              type="button"
              aria-expanded="true"
              aria-controls="side-nav-group-charts">
              Graficos
              <span class="cds--side-nav__submenu-chevron" aria-hidden="true">v</span>
            </button>
            <ul id="side-nav-group-charts" class="cds--side-nav__menu">
              <li><a class="cds--side-nav__link" href="#chart-type">Selecionar tipo</a></li>
              <li><a class="cds--side-nav__link" href="#chart-container">Ver grafico</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </aside>

    <main id="main-content" class="app">
      <h1>Carbon Charts</h1>
      <label class="field-label" for="chart-type">Escolha um exemplo</label>
      <select id="chart-type" class="chart-select" aria-label="Selecionar tipo de grafico">
        <option value="line">Line</option>
        <option value="area">Area</option>
        <option value="simple_bar">Simple bar</option>
        <option value="grouped_bar">Grouped bar</option>
        <option value="stacked_bar">Stacked bar</option>
        <option value="pie">Pie</option>
        <option value="donut">Donut</option>
        <option value="scatter">Scatter</option>
        <option value="bubble">Bubble</option>
        <option value="radar">Radar</option>
      </select>
      <div id="chart-container" class="chart"></div>
    </main>

    <script src="https://unpkg.com/@carbon/charts@1.27.3/dist/umd/bundle.umd.js"></script>
    <script src="script.js"></script>
  </body>
</html>
