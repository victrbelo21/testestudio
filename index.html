<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TesteStudio</title>
    <link rel="stylesheet" href="https://unpkg.com/@carbon/charts@1.27.3/styles.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="cds--skip-to-content" href="#main-content">Pular para conteudo</a>

    <header class="cds--header" aria-label="IBM Platform Name">
      <button
        id="header-menu-toggle"
        class="cds--header__menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="side-nav">
        <img class="icon-24" src="https://unpkg.com/@carbon/icons@11.71.0/svg/menu.svg" alt="" aria-hidden="true" />
      </button>

      <a class="cds--header__name" href="#main-content">
        <span class="cds--header__name--prefix">IBM</span>
        TesteStudio
      </a>

      <nav class="cds--header__nav" aria-label="IBM [Platform]">
        <a class="cds--header__menu-item" href="#main-content">Dashboard</a>
        <a class="cds--header__menu-item" href="#chart-container">Graficos</a>
      </nav>

      <div class="cds--header__global">
        <button class="cds--header__action" type="button" aria-label="Search">
          <img class="icon-24" src="https://unpkg.com/@carbon/icons@11.71.0/svg/search.svg" alt="" aria-hidden="true" />
        </button>
        <button class="cds--header__action" type="button" aria-label="Notifications">
          <img class="icon-24" src="https://unpkg.com/@carbon/icons@11.71.0/svg/notification.svg" alt="" aria-hidden="true" />
        </button>
        <button class="cds--header__action" type="button" aria-label="App switcher">
          <img class="icon-24" src="https://unpkg.com/@carbon/icons@11.71.0/svg/switcher.svg" alt="" aria-hidden="true" />
        </button>
      </div>
    </header>

    <div id="side-nav-overlay" class="cds--side-nav__overlay" hidden></div>

    <aside id="side-nav" class="cds--side-nav" aria-label="Side navigation" aria-hidden="true">
      <nav class="cds--side-nav__navigation">
        <ul class="cds--side-nav__items">
          <li class="cds--side-nav__item">
            <a class="cds--side-nav__link" href="#main-content">Visao geral</a>
          </li>

          <li class="cds--side-nav__item is-open">
            <button
              class="cds--side-nav__submenu"
              type="button"
              aria-expanded="true"
              aria-controls="side-nav-group-charts">
              Graficos
              <img class="icon-24 chevron-icon" src="https://unpkg.com/@carbon/icons@11.71.0/svg/chevron--down.svg" alt="" aria-hidden="true" />
            </button>
            <ul id="side-nav-group-charts" class="cds--side-nav__menu">
              <li><a class="cds--side-nav__link" href="#chart-selector">Selecionar tipo</a></li>
              <li><a class="cds--side-nav__link" href="#chart-container">Ver grafico</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </aside>

    <main id="main-content" class="app">
      <h1>Carbon Charts</h1>

      <div class="controls-grid">
        <cds-dropdown id="chart-selector" title-text="Grafico" label="Escolha um grafico" value="line" helper-text="Dropdown padrao Carbon">
          <cds-dropdown-item value="line">Line</cds-dropdown-item>
          <cds-dropdown-item value="area">Area</cds-dropdown-item>
          <cds-dropdown-item value="simple_bar">Simple bar</cds-dropdown-item>
          <cds-dropdown-item value="grouped_bar">Grouped bar</cds-dropdown-item>
          <cds-dropdown-item value="stacked_bar">Stacked bar</cds-dropdown-item>
          <cds-dropdown-item value="pie">Pie</cds-dropdown-item>
          <cds-dropdown-item value="donut">Donut</cds-dropdown-item>
          <cds-dropdown-item value="scatter">Scatter</cds-dropdown-item>
          <cds-dropdown-item value="bubble">Bubble</cds-dropdown-item>
          <cds-dropdown-item value="radar">Radar</cds-dropdown-item>
        </cds-dropdown>

        <cds-text-input id="scale-a" title-text="Produto A" label="Multiplicador Produto A" value="1" helper-text="Ex.: 1.10 para +10%" type="number"></cds-text-input>
        <cds-text-input id="scale-b" title-text="Produto B" label="Multiplicador Produto B" value="1" helper-text="Ex.: 0.90 para -10%" type="number"></cds-text-input>
      </div>

      <div id="chart-container" class="chart"></div>
    </main>

    <script type="module" src="https://1.www.s81c.com/common/carbon/web-components/version/v2.51.1/dropdown.min.js"></script>
    <script type="module" src="https://1.www.s81c.com/common/carbon/web-components/version/v2.51.1/text-input.min.js"></script>
    <script src="https://unpkg.com/@carbon/charts@1.27.3/dist/umd/bundle.umd.js"></script>
    <script src="script.js"></script>
  </body>
</html>
